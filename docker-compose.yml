version: '3.8'

services:
  backend:
    build: ./backend
    image: equipment-backend:latest
    ports:
      - "8090:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  web:
    build: ./web
    image: equipment-web:latest
    ports:
      - "3090:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3007:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Repo2
  repo2-app:
    build: ./repo2
    container_name: repo2-app
    ports:
      - "3011:3000"
    restart: unless-stopped

  # Repo3 FIX (two services)
  repo3-backend:
    build: ./repo3/backend
    container_name: repo3-backend
    ports:
      - "3012:8000"
    restart: unless-stopped

  repo3-frontend:
    build: ./repo3/frontend
    container_name: repo3-frontend
    ports:
      - "3013:3000"
    depends_on:
      - repo3-backend
    restart: unless-stopped

  # Repo4
  repo4-app:
    build: ./repo4
    container_name: repo4-app
    ports:
      - "3014:3000"
    restart: unless-stopped

volumes:
  db_data: