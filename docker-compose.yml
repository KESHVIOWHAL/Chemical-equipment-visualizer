services:

  backend:
    build: ./backend
    image: equipment-backend:latest
    ports:
      - "8090:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  web:
    build: ./web
    image: equipment-web:latest
    ports:
      - "3090:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports:
      - "3007:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ========================
  # REPO2
  # ========================

  repo2-backend:
    build: ./repo2/backend
    ports:
      - "8011:8000"
    restart: unless-stopped

  repo2-frontend:
    build: ./repo2/frontend
    ports:
      - "3011:3000"
    depends_on:
      - repo2-backend
    restart: unless-stopped

  # ========================
  # REPO3
  # ========================

  repo3-backend:
    build: ./repo3/backend
    ports:
      - "8012:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/testdb
    depends_on:
      - mongo
    restart: unless-stopped

  repo3-frontend:
    build: ./repo3/frontend
    ports:
      - "3012:3000"
    depends_on:
      - repo3-backend
    restart: unless-stopped

  # ========================
  # REPO4
  # ========================

  repo4-app:
    build: ./repo4
    ports:
      - "3013:3000"
    restart: unless-stopped

volumes:
  db_data:
  mongo_data: