version: '3.8'

services:
  backend:
    build: ./backend
    image: equipment-backend:latest
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  web:
    build: ./web
    image: equipment-web:latest
    ports:
      - "3006:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
